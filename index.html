<html lang="zh-hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNO 身份狀態追蹤器</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --text2: #5f6572;
    --accent: #1a56db;
    --accent2: #e8eefb;
    --green: #0d8c44;
    --green-bg: #d4f5e0;
    --amber: #b45309;
    --amber-bg: #fef3c7;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  .header { background: var(--accent); color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .header > div:first-child { min-width: 0; flex: 1 1 280px; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header .subtitle { font-size: 12px; opacity: .85; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .lang-toggle { display: inline-flex; border: 1px solid rgba(255,255,255,.4); border-radius: 6px; overflow: hidden; }
  .lang-toggle button { background: transparent; color: #fff; border: none; padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 500; }
  .lang-toggle button.active { background: #fff; color: var(--accent); }
  .tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; }
  .tab { padding: 10px 18px; font-size: 14px; cursor: pointer; border: none; background: none; color: var(--text2); border-bottom: 2px solid transparent; transition: all .15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
  .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-blue { background: var(--accent2); color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 8px 12px; border-bottom: 2px solid var(--border); color: var(--text2); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: var(--accent2); }
  .btn { display: inline-flex; align-items: center; gap: 4px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text); transition: all .15s; }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #1548b8; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-danger { color: var(--red); }
  .btn-danger:hover { background: var(--red-bg); }
  .btn:disabled, .lang-toggle button:disabled { opacity: .45; cursor: default; pointer-events: none; }
  .form-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
  .form-group { display: flex; flex-direction: column; gap: 3px; }
  .form-group label { font-size: 12px; color: var(--text2); font-weight: 500; }
  input, select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; background: var(--card); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent2); }
  .stat { text-align: center; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
  .progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width .3s; }
  .member-header { display: flex; justify-content: space-between; align-items: center; }
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--card); border-radius: 12px; padding: 24px; width: 90%; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .modal h2 { margin-bottom: 16px; }
  .modal .form-row { margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty-state p { margin: 8px 0; }
  /* Cross-member comparison bar. Replaces Chart.js: the library was 201 KB
     (4x this whole file) purely to draw a stacked bar the per-member progress
     bars already imply, and it was the only thing this app fetched over the
     network. */
  .cmp { display: flex; flex-direction: column; gap: 10px; }
  .cmp-row { display: grid; grid-template-columns: minmax(70px, 140px) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
  .cmp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
  .cmp-track { position: relative; height: 20px; background: var(--border); border-radius: 4px; }
  .cmp-fill { height: 100%; border-radius: 4px; transition: width .3s; }
  /* The 180 cap is a marker inside the track, not the end of it - a member
     over the limit must render past the line rather than pinning at it. */
  .cmp-cap { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); opacity: .5; }
  .cmp-val { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 3.2em; text-align: right; }
  .cmp-legend { margin-top: 12px; font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .cmp-legend i { display: inline-block; width: 2px; height: 12px; background: var(--text); opacity: .5; }
  .calc-notice { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .calc-notice button { flex: none; }
  .info-box { background: var(--accent2); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 13px; color: var(--accent); margin-bottom: 16px; }
  .warning-box { background: var(--amber-bg); border-left: 3px solid var(--amber); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 13px; color: var(--amber); margin-bottom: 16px; }
  .danger-box { background: var(--red-bg); border-left: 3px solid var(--red); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 13px; color: var(--red); margin-bottom: 16px; }

  /* A failed write must be visible. On disk this is a full volume or a
     permissions problem, not a cache miss - silence would mean the user
     believes a trip was recorded when it was not. */
  .save-error { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 200; background: var(--red-bg); color: var(--red); border: 1px solid var(--red); padding: 10px 16px; border-radius: 8px; font-size: 13px; box-shadow: var(--shadow); max-width: 90%; }

  .app-footer { max-width: 1200px; margin: 24px auto 0; padding: 16px 24px 32px; font-size: 12px; color: var(--text2); line-height: 1.6; border-top: 1px solid var(--border); }
  .app-footer strong { color: var(--text); }
  .app-footer a { color: var(--accent); text-decoration: none; }
  .app-footer a:hover { text-decoration: underline; }
  .build-id { font-variant-numeric: tabular-nums; opacity: .75; white-space: nowrap; }
  @media print { .tabs, .header-actions, .btn, .tab { display: none !important; } .card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; } }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .container { padding: 10px; } }
</style>
</head>

<input type="file" id="importInput" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
// ============ BUILD IDENTITY ============
// Two bundles of the same version with no version shown anywhere is how you end
// up with a stale copy in /Applications and no way to tell. APP_VERSION is the
// single source of truth: desktop/scripts/sync.mjs refuses to build when
// tauri.conf.json disagrees, so a bundle can never claim a version the UI does
// not show. BUILD_STAMP is substituted by that script in the COPY it writes to
// dist/ - never in this file - which is what lets the desktop build carry a real
// build time while the web build stays a static file with no build step.
const APP_VERSION = '0.2.0';
const BUILD_STAMP = '__BUILD_STAMP__';

// ============ RULES PROVENANCE ============
// The rules encoded here are a reading of the published UKVI guidance as of a
// date. That date has a 90-day shelf life: past it the app says so instead of
// carrying on rendering confident numbers at people deciding when to file for
// ILR. This is what lets the tool degrade honestly rather than silently, and it
// is why the tool does not need to track rule changes - it stops claiming to be
// current on its own.
//
// RULES_CHECKED IS A CLAIM THAT A HUMAN READ GOV.UK ON THAT DAY.
// Bumping it to silence the banner, without re-reading the guidance, is the one
// edit to this file that converts an honesty feature into a lie. Empty means
// nobody has checked, and the app says exactly that.
const RULES_CHECKED = '2026-09-03';  // 'YYYY-MM-DD', or '' if never verified
const RULES_SHELF_LIFE_DAYS = 90;

function rulesStatus() {
  if (!RULES_CHECKED) return { state: 'unverified', age: null };
  const age = daysBetween(RULES_CHECKED, todayStr());
  if (!isFinite(age)) return { state: 'unverified', age: null };
  return { state: age >= RULES_SHELF_LIFE_DAYS ? 'stale' : 'fresh', age };
}

// Loud only when it should be. Fresh states say their piece quietly in the
// footer; stale and unverified get a box above the numbers on every tab.
function rulesBanner() {
  const r = rulesStatus();
  if (r.state === 'fresh') return '';
  const msg = r.state === 'unverified' ? t('rulesUnverified') : t('rulesStale')(fmt(RULES_CHECKED), r.age);
  return `<div class="warning-box">${msg}</div>`;
}

function rulesFooterLine() {
  const r = rulesStatus();
  if (r.state === 'unverified') return t('rulesFooterUnverified');
  return t('rulesFooterChecked')(fmt(RULES_CHECKED)) + (r.state === 'stale' ? ' ' + t('rulesFooterStale') : '');
}

function buildLabel() {
  const stamp = BUILD_STAMP.startsWith('__') ? '' : ' · ' + BUILD_STAMP;
  return 'v' + APP_VERSION + ' · ' + (isDesktop ? t('shellDesktop') : t('shellWeb')) + stamp;
}

// ============ DATA LAYER ============
// Two shells, one file. Tauri v2 exposes its plugin APIs on window.__TAURI__
// when `withGlobalTauri` is set, so feature-detecting it here is what lets this
// single index.html serve both the GitHub Pages build (localStorage) and the
// desktop build (a real file on disk) with no build step and no branching
// anywhere else in the app.
const STORAGE_KEY = 'bno-tracker-data';
const DATA_FILE = 'bno-tracker.json';
const BACKUP_DIR = 'backups';
const BACKUP_KEEP = 30;

const TAURI = typeof window !== 'undefined' ? window.__TAURI__ : undefined;
const isDesktop = !!TAURI;

// A one-off notice for people whose numbers moved when the rolling window was
// corrected. Shown only to someone who already had records: a fresh install
// gets the ack stamped by getDefaultData(), because a new user never saw the old
// numbers and a correction notice for a version they never used is just noise.
// Stored with the data rather than per-device so the acknowledgement travels
// with an export, and so a restored old backup correctly shows it again.
const CALC_NOTICE_ID = 'rolling-12m-2026-09';

function getDefaultData() {
  return { familyName: 'Family', members: [], trips: [], calcNoticeAck: CALC_NOTICE_ID };
}

function calcNoticeDue() {
  return data.members.length > 0 && data.calcNoticeAck !== CALC_NOTICE_ID;
}

function calcNotice() {
  if (!calcNoticeDue()) return '';
  return `<div class="info-box calc-notice">
    <div>${t('calcNoticeBody')}</div>
    <button class="btn btn-sm" onclick="ackCalcNotice()">${t('calcNoticeAck')}</button>
  </div>`;
}

function ackCalcNotice() {
  data.calcNoticeAck = CALC_NOTICE_ID;
  persist();
  render(getCurrentTab());
}

const WebStore = {
  async load() {
    const raw = localStorage.getItem(STORAGE_KEY);
    // A missing key is a first run. A corrupt one is NOT: let it throw so boot()
    // can stop, rather than silently handing back an empty family.
    return raw ? JSON.parse(raw) : getDefaultData();
  },
  async save(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); },
  describe() { return 'localStorage'; }
};

const DesktopStore = {
  _dir: null,
  async _paths() {
    if (!this._dir) {
      this._dir = await TAURI.path.appDataDir();
      await TAURI.fs.mkdir(this._dir, { recursive: true });
      await TAURI.fs.mkdir(await TAURI.path.join(this._dir, BACKUP_DIR), { recursive: true });
    }
    return {
      file: await TAURI.path.join(this._dir, DATA_FILE),
      tmp: await TAURI.path.join(this._dir, DATA_FILE + '.tmp'),
      backups: await TAURI.path.join(this._dir, BACKUP_DIR),
    };
  },
  async load() {
    const p = await this._paths();
    if (!(await TAURI.fs.exists(p.file))) return getDefaultData();
    return JSON.parse(await TAURI.fs.readTextFile(p.file));
  },
  async save(d) {
    const p = await this._paths();
    await this._backup(p);
    // Atomic write: a crash between these two lines leaves the previous file
    // intact. Writing in place would truncate the only copy of a family's
    // records, which on desktop is the whole dataset rather than a cache.
    await TAURI.fs.writeTextFile(p.tmp, JSON.stringify(d, null, 2));
    await TAURI.fs.rename(p.tmp, p.file);
  },
  // One snapshot per calendar day, newest BACKUP_KEEP retained. In a browser a
  // wedged dataset can be cleared from devtools; inside a packaged .app a
  // non-technical user has no such escape hatch, so keep them one.
  async _backup(p) {
    if (!(await TAURI.fs.exists(p.file))) return;
    const dest = await TAURI.path.join(p.backups, todayStr() + '.json');
    if (await TAURI.fs.exists(dest)) return;
    await TAURI.fs.copyFile(p.file, dest);
    const names = (await TAURI.fs.readDir(p.backups))
      .filter(e => e.isFile && /^\d{4}-\d{2}-\d{2}\.json$/.test(e.name))
      .map(e => e.name).sort();
    for (const n of names.slice(0, Math.max(0, names.length - BACKUP_KEEP))) {
      await TAURI.fs.remove(await TAURI.path.join(p.backups, n));
    }
  },
  describe() { return this._dir || 'the application data folder'; }
};

const Store = isDesktop ? DesktopStore : WebStore;

let data = getDefaultData();
let storeReady = false;

// Never write before the first read has finished. Without this guard a click
// during a slow load persists an empty dashboard over a real data file - the
// one bug in this refactor that destroys data rather than merely annoying.
function persist() {
  if (!storeReady) return;
  Store.save(data)
    .then(() => { document.getElementById('saveError').hidden = true; })
    .catch(showStoreError);
}

function showStoreError(err) {
  const el = document.getElementById('saveError');
  el.textContent = t('saveFailMsg') + ' ' + (err && err.message ? err.message : String(err));
  el.hidden = false;
}

// ============ DATE UTILITIES ============
// IMPORTANT: <input type="date"> values are YYYY-MM-DD strings. `new Date("YYYY-MM-DD")`
// parses them as UTC midnight — that flips to the previous day in any UTC-negative
// timezone, breaking display and arithmetic. parseDate + toDateStr keep everything
// in the user's LOCAL calendar.
function parseDate(d) {
  if (d instanceof Date) return new Date(d.getTime());
  if (typeof d === 'string') {
    const m = d.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  return new Date(d);
}

function toDateStr(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function daysBetween(d1, d2) {
  const a = parseDate(d1); a.setHours(0,0,0,0);
  const b = parseDate(d2); b.setHours(0,0,0,0);
  return Math.round((b - a) / 86400000);
}

function addDays(d, n) {
  const r = parseDate(d); r.setDate(r.getDate() + n); return r;
}

// Calendar anniversary, NOT n*365 days. Five years is 1,826 or 1,827 days
// depending on how many leap days fall in the window, so day arithmetic lands
// 1-2 days EARLY — and an ILR application filed early is refused with the fee
// kept. A 29 February grant date has no anniversary in a common year; JS
// normalises it to 1 March, which is the direction we want: late is harmless,
// early is not.
function addYears(d, n) {
  const r = parseDate(d);
  return new Date(r.getFullYear() + n, r.getMonth(), r.getDate());
}

function fmt(d) {
  if (!d) return '';
  const dt = parseDate(d);
  return dt.toLocaleDateString(t('locale'), { day: '2-digit', month: 'short', year: 'numeric' });
}

function todayStr() {
  return toDateStr(new Date());
}

function _todayMidnight() {
  const d = new Date(); d.setHours(0,0,0,0); return d;
}

// ============ BNO ILR CALCULATION ENGINE ============
// MIDNIGHT RULE: a day counts as absent only if the person is outside the UK at
// the END of that day (UK midnight). So the day of departure counts as absent
// (still abroad at midnight) but the day of return does NOT (back in UK at
// midnight). The "absence interval" for a completed trip is therefore
// [departureDate, returnDate - 1] inclusive. For an ongoing trip with no
// return date set yet, it's [departureDate, evalDate] (the user is presumed
// still abroad at the next midnight).
function tripAbsenceRange(trip, evalDate) {
  const start = parseDate(trip.departureDate); start.setHours(0,0,0,0);
  let end;
  if (trip.returnDate) {
    end = addDays(trip.returnDate, -1); end.setHours(0,0,0,0);
  } else {
    end = new Date(evalDate.getTime()); end.setHours(0,0,0,0);
  }
  return { start, end, valid: start <= end };
}

function tripAbsenceDays(trip, evalDate) {
  const r = tripAbsenceRange(trip, evalDate);
  if (!r.valid) return 0;
  return daysBetween(toDateStr(r.start), toDateStr(r.end)) + 1;
}

// ============ ABSENCE TIMELINE ============
// The rule is "no more than 180 days outside the UK in ANY rolling 12-month
// period", so every window evaluated here is 365 days long and the cap inside
// it is 180. Counting over a 180-day window instead — which this file used to
// do — makes the cap structurally unreachable, because a 180-day window can
// hold at most 180 absent days. Two 170-day trips seven months apart are 340
// days in one year, a plain breach, and the old code scored them 170 and
// passed the applicant as ILR-eligible.
const WINDOW_DAYS = 365;   // "any 12-month period"
const MAX_ABSENCE = 180;   // days permitted inside it

// One day-by-day absence timeline per member, indexed from the BNO grant date,
// with a prefix sum so any window is an O(1) subtraction. It is a day SET
// rather than a sum of per-trip lengths for two reasons: overlapping trip
// records (a realistic slip when a family logs the same journey twice) count
// each day once instead of twice, and the rolling scan below needs a few
// thousand window queries, which per-trip arithmetic would make quadratic.
function buildAbsenceTimeline(grantDate, memberTrips, horizon, ongoingEnd) {
  const span = daysBetween(grantDate, horizon);
  // Missing or unparseable grant date, or a grant date after the horizon:
  // return an empty timeline so every query is 0 rather than throwing.
  if (!isFinite(span) || span < 0) return { prefix: new Int32Array(1), n: 0 };
  const n = span + 1;
  const flags = new Uint8Array(n);
  memberTrips.forEach(trip => {
    const r = tripAbsenceRange(trip, ongoingEnd);
    if (!r.valid) return;
    // A trip already under way when the visa was granted is clipped at index 0.
    const from = Math.max(0, daysBetween(grantDate, r.start));
    const to = Math.min(n - 1, daysBetween(grantDate, r.end));
    for (let i = from; i <= to; i++) flags[i] = 1;
  });
  const prefix = new Int32Array(n + 1);
  for (let i = 0; i < n; i++) prefix[i + 1] = prefix[i] + flags[i];
  return { prefix, n };
}

// Absent days in [from, to], both day-indices counted from the grant date. The
// range is clipped to the timeline, so a window reaching back past the grant
// date counts only the days actually spent on the visa.
function absentInRange(tl, from, to) {
  if (tl.n === 0) return 0;
  const a = Math.max(0, from);
  const b = Math.min(tl.n - 1, to);
  return a > b ? 0 : tl.prefix[b + 1] - tl.prefix[a];
}

// `referenceDate` (optional, YYYY-MM-DD) controls the END of the rolling
// 12-month window. Defaults to today. The What-If Planner passes the proposed
// trip's RETURN date so future trips are evaluated at trip end — this is the
// only point at which a long future trip's absence days are fully inside the
// window. ILR eligibility (isEligible / daysToILR / worstWindow) always uses
// today, so a merely planned trip never retroactively changes whether the
// applicant has been compliant so far.
function calcRollingWindow(member, trips, referenceDate) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const refDate = referenceDate ? parseDate(referenceDate) : new Date(today.getTime());
  refDate.setHours(0,0,0,0);
  // Use the LATER of today and refDate so the planner never reports a rolling
  // window that's better than the current state when the proposed trip is short.
  const evalDate = refDate > today ? refDate : today;

  const memberTrips = trips.filter(tr => tr.memberId === member.id)
    .sort((a,b) => parseDate(a.departureDate) - parseDate(b.departureDate));

  const grantDate = parseDate(member.bnoGrantDate);
  grantDate.setHours(0,0,0,0);

  // Ongoing trips (no return date yet) run to evalDate, so the planner presumes
  // the traveller is still abroad. The historical scans below never read an
  // index past today, so this one timeline serves both.
  const tl = buildAbsenceTimeline(grantDate, memberTrips, evalDate, evalDate);
  const evalIdx = daysBetween(grantDate, evalDate);
  const todayIdx = daysBetween(grantDate, today);

  const daysAbsentInWindow = absentInRange(tl, evalIdx - (WINDOW_DAYS - 1), evalIdx);
  const remaining = Math.max(0, MAX_ABSENCE - daysAbsentInWindow);
  const status = daysAbsentInWindow >= MAX_ABSENCE ? 'red'
    : daysAbsentInWindow >= 120 ? 'amber'
    : 'green';

  const totalAbsent = absentInRange(tl, 0, todayIdx);

  const ilrEarliest = addYears(member.bnoGrantDate, 5);
  const ilrEarliestStr = toDateStr(ilrEarliest);

  // Worst 12-month absence across EVERY rolling window ending between the grant
  // date and today — not a handful of fixed blocks. The old version sampled ten
  // 180-day periods on a 182-day stride, which left two uncovered days between
  // each pair and, worse, could not see a breach straddling a boundary: 175
  // absent days ending at a block edge plus 175 starting right after is 350
  // days inside one year, and it scored 175. Windows are clipped at the grant
  // date, so a partial first year is evaluated too.
  let worstWindow = 0;
  for (let i = 0; i <= todayIdx; i++) {
    const inWindow = absentInRange(tl, i - (WINDOW_DAYS - 1), i);
    if (inWindow > worstWindow) worstWindow = inWindow;
  }

  // Unchanged from the previous version: this treats exactly 180 days as a
  // breach, one day stricter than "no more than 180 days". Strict is the
  // harmless direction, but it is worth checking against gov.uk.
  const isCompliant = worstWindow < MAX_ABSENCE;
  const isEligible = ilrEarliest <= today && isCompliant;
  const isGettingClose = ilrEarliest <= addDays(today, 90) && isCompliant;

  const daysToILR = Math.max(0, daysBetween(todayStr(), ilrEarliestStr));

  return {
    daysAbsentInWindow,
    remaining,
    status,
    totalAbsent,
    isCompliant,
    isEligible,
    isGettingClose,
    daysToILR,
    ilrEarliest,
    ilrEarliestStr,
    worstWindow
  };
}

// ============ TAB NAVIGATION ============
function showTab(name) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  render(name);
}

// ============ RENDER ENGINE ============
function render(tab) {
  const app = document.getElementById('app');
  let body = '';
  switch(tab) {
    case 'dashboard': body = renderDashboard(); break;
    case 'members': body = renderMembers(); break;
    case 'trips': body = renderTrips(); break;
    case 'planner': body = renderPlanner(); break;
  }
  // Prepended on every tab, not just the dashboard: members and the planner
  // render numbers too, and a staleness warning that only appears on one screen
  // is a warning the user can miss.
  app.innerHTML = calcNotice() + rulesBanner() + body;
}

function renderDashboard() {
  const totalMembers = data.members.length;
  if (totalMembers === 0) {
    return `<div class="empty-state"><h2>${t('welcomeTitle')}</h2><p>${t('welcomeMsg')}</p><button class="btn btn-primary" onclick="showTab('members')">${t('addFirstMember')}</button></div>`;
  }

  const results = data.members.map(m => ({ member: m, calc: calcRollingWindow(m, data.trips) }));

  const compliant = results.filter(r => r.calc.status === 'green').length;
  const warnings = results.filter(r => r.calc.status === 'amber').length;
  const violations = results.filter(r => r.calc.status === 'red').length;

  let memberCards = results.map(r => {
    const { member: m, calc } = r;
    const pct = Math.min(100, Math.round((calc.daysAbsentInWindow / 180) * 100));
    const barColor = calc.status === 'green' ? 'var(--green)' : calc.status === 'amber' ? 'var(--amber)' : 'var(--red)';
    const statusLabel = calc.status === 'green' ? t('statusGreen') : calc.status === 'amber' ? t('statusAmber') : t('statusRed');

    let ilrInfo = '';
    // A member who has breached the 12-month limit must never be shown a
    // countdown: with the grant date 5 years past, daysToILR is 0, and
    // "ILR in 0 days" reads as "apply now" to someone who cannot apply at all.
    if (!calc.isCompliant) {
      ilrInfo = `<span class="badge badge-red">${t('ilrNotEligible')}</span>`;
    } else if (calc.isEligible) {
      ilrInfo = `<span class="badge badge-green">${t('ilrEligible')}</span>`;
    } else if (calc.isGettingClose) {
      ilrInfo = `<span class="badge badge-amber">${t('ilrApprox')(calc.daysToILR)}</span>`;
    } else {
      ilrInfo = `<span class="badge badge-blue">${t('ilrIn')(calc.daysToILR)}</span>`;
    }

    return `
      <div class="card">
        <div class="member-header">
          <h3 style="margin:0">${esc(m.name)}</h3>
          <span class="badge badge-${calc.status}">${statusLabel}</span>
        </div>
        <div style="margin-top:12px">
          <div class="grid3">
            <div class="stat">
              <div class="stat-value" style="color:var(--${calc.status === 'green' ? 'green' : calc.status === 'amber' ? 'amber' : 'red'})">${calc.daysAbsentInWindow}</div>
              <div class="stat-label">${t('daysInWindow')}</div>
            </div>
            <div class="stat">
              <div class="stat-value">${calc.remaining}</div>
              <div class="stat-label">${t('daysRemaining')}</div>
            </div>
            <div class="stat">
              <div class="stat-value">${calc.totalAbsent}</div>
              <div class="stat-label">${t('totalDaysAbsent')}</div>
            </div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${pct}%;background:${barColor}"></div>
          </div>
          <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:12px;color:var(--text2)">${t('bnoGrantDate')}: ${fmt(m.bnoGrantDate)}</span>
            ${ilrInfo}
          </div>
          ${calc.worstWindow >= 150 ? `<div class="warning-box" style="margin-top:8px">${t('worstWindowMsg')(calc.worstWindow)}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="grid3">
      <div class="card stat">
        <div class="stat-value">${totalMembers}</div>
        <div class="stat-label">${t('statFamily')}</div>
      </div>
      <div class="card stat">
        <div class="stat-value" style="color:var(--green)">${compliant}</div>
        <div class="stat-label">${t('statWithin')}</div>
      </div>
      <div class="card stat">
        <div class="stat-value" style="color:${warnings > 0 ? 'var(--amber)' : 'var(--green)'}">${warnings}</div>
        <div class="stat-label">${t('statNear')}</div>
      </div>
      ${violations > 0 ? `
      <div class="card stat">
        <div class="stat-value" style="color:var(--red)">${violations}</div>
        <div class="stat-label">${t('statOver')}</div>
      </div>` : ''}
    </div>
    <div class="grid">${memberCards}</div>
    <div class="card" style="margin-top:16px">
      <h2>${t('chartTitle')}</h2>
      ${renderComparison(results)}
    </div>`;
}

// ============ PLANNER LOGIC ============
function calcPlanner() {
  const memberId = document.getElementById('planMember').value;
  const departure = document.getElementById('planDeparture').value;
  const returnDate = document.getElementById('planReturn').value;
  if (!departure || !returnDate) { alert(t('alertTwoDates')); return; }

  const member = data.members.find(m => m.id === memberId);
  if (!member) return;

  const proposedTrips = [...data.trips, { memberId, departureDate: departure, returnDate }];
  // Evaluate the rolling 12-month window at the END of the proposed trip — that's
  // when its absence days are fully inside the window. Without this, a 200-day
  // future trip would falsely report "OK to travel" because today's window only
  // overlaps with 1 day of it.
  const calc = calcRollingWindow(member, proposedTrips, returnDate);
  const currentCalc = calcRollingWindow(member, data.trips);
  // Midnight rule: depart day counts, return day doesn't → daysBetween (no +1)
  const tripDays = daysBetween(departure, returnDate);

  const headline = calc.status === 'green' ? t('canTravel') : calc.status === 'amber' ? t('watchOut') : t('cantTravel');

  let resultHtml = `
    <div class="card">
      <h2>${t('resultFor')(esc(member.name))}</h2>
      <div class="${calc.status === 'green' ? 'info-box' : calc.status === 'amber' ? 'warning-box' : 'danger-box'}">
        <strong>${headline}</strong><br>
        ${t('currentLine')(currentCalc.daysAbsentInWindow, calc.daysAbsentInWindow)}
      </div>
      <div class="grid3">
        <div class="stat">
          <div class="stat-value">${tripDays}</div>
          <div class="stat-label">${t('tripDurationLabel')}</div>
        </div>
        <div class="stat">
          <div class="stat-value" style="color:${calc.daysAbsentInWindow >= 180 ? 'var(--red)' : calc.daysAbsentInWindow >= 120 ? 'var(--amber)' : 'var(--green)'}">${calc.daysAbsentInWindow}</div>
          <div class="stat-label">${t('daysWindowAfter')}</div>
        </div>
        <div class="stat">
          <div class="stat-value">${calc.remaining}</div>
          <div class="stat-label">${t('daysRemaining')}</div>
        </div>
      </div>
      <div style="margin-top:12px">
        <div class="progress-bar">
          <div class="progress-fill" style="width:${Math.min(100, Math.round((calc.daysAbsentInWindow/180)*100))}%;background:${calc.status === 'green' ? 'var(--green)' : calc.status === 'amber' ? 'var(--amber)' : 'var(--red)'}"></div>
        </div>
      </div>
    </div>`;

  document.getElementById('planResult').innerHTML = resultHtml;
}

// ============ EXPORT/IMPORT ============
// On desktop the native Save/Open dialogs run in Rust (see src-tauri/src/lib.rs)
// and the chosen path never crosses into JavaScript, which is what allows the
// fs capability to stay scoped to the app's own folder. In a browser this falls
// back to the ordinary blob download and <input type="file">.
async function saveOut(filename, contents, mime) {
  if (isDesktop) {
    try { await TAURI.core.invoke('export_file', { suggested: filename, contents }); }
    catch (err) { showStoreError(err); }
    return;
  }
  const url = URL.createObjectURL(new Blob([contents], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  a.click(); URL.revokeObjectURL(url);
}

function exportData() {
  saveOut(`bno-tracker-${todayStr()}.json`, JSON.stringify(data, null, 2), 'application/json');
}

async function importData() {
  if (isDesktop) {
    let text;
    try { text = await TAURI.core.invoke('import_file'); }
    catch (err) { showStoreError(err); return; }
    if (text == null) return;   // cancelled
    applyImport(text);
    return;
  }
  document.getElementById('importInput').click();
}

// The old check was `if (imported.members)`, which accepted {"members": 5} and
// wrote it straight to storage - the app then threw on every render, for good.
// In a browser you can clear storage from devtools; inside a packaged .app a
// non-technical user cannot, so the import gate has to be real.
// Returns null when valid, otherwise a human-readable reason.
function validateImport(o) {
  const isDateStr = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(parseDate(v));
  if (!o || typeof o !== 'object' || Array.isArray(o)) return t('vNotObject');
  if (!Array.isArray(o.members)) return t('vMembers');
  if (!Array.isArray(o.trips)) return t('vTrips');
  const ids = new Set();
  for (const m of o.members) {
    if (!m || typeof m !== 'object') return t('vMemberShape');
    if (typeof m.id !== 'string' || !m.id) return t('vMemberId');
    if (ids.has(m.id)) return t('vMemberDup')(m.id);
    ids.add(m.id);
    if (typeof m.name !== 'string') return t('vMemberName');
    if (!isDateStr(m.bnoGrantDate)) return t('vMemberDate')(m.name || m.id);
  }
  for (const tr of o.trips) {
    if (!tr || typeof tr !== 'object') return t('vTripShape');
    if (typeof tr.id !== 'string' || !tr.id) return t('vTripId');
    if (!ids.has(tr.memberId)) return t('vTripOrphan')(tr.memberId);
    if (!isDateStr(tr.departureDate)) return t('vTripDate');
    if (tr.returnDate && !isDateStr(tr.returnDate)) return t('vTripDate');
    if (tr.returnDate && tr.returnDate < tr.departureDate) return t('vTripOrder');
  }
  return null;
}

function applyImport(text) {
  let imported;
  try { imported = JSON.parse(text); }
  catch { alert(t('alertCantParse')); return; }
  const problem = validateImport(imported);
  // Reject without touching anything: existing data stays exactly as it was.
  if (problem) { alert(t('alertInvalidFile') + '\n\n' + problem); return; }
  data = imported;
  persist();
  render(getCurrentTab());
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => applyImport(e.target.result);
  reader.readAsText(file);
  event.target.value = '';
}

function exportCSV() {
  if (data.trips.length === 0) { alert(t('alertNoTrips')); return; }
  let csv = t('csvHeader') + '\n';
  data.trips.forEach(tr => {
    const name = getMemberName(tr.memberId);
    // Midnight rule absence days (depart inclusive, return exclusive)
    const dur = tripAbsenceDays(tr, _todayMidnight());
    csv += `"${name}","${tr.departureDate}","${tr.returnDate || ''}",${dur},"${tr.purpose || ''}"\n`;
  });
  saveOut(`bno-trips-${todayStr()}.csv`, csv, 'text/csv');
}

// ============ HELPERS ============
function genId() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function esc(s) {
  if (s === undefined || s === null || s === '') return '';
  // Escapes for BOTH text and attribute contexts. The old textContent ->
  // innerHTML trick handled < > & but left " untouched, so a member name
  // containing a quote escaped value="..." and injected live attributes.
  return String(s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function getMemberName(id) { const m = data.members.find(x => x.id === id); return m ? m.name : t('unknown'); }
function getCurrentTab() {
  const active = document.querySelector('.tab.active');
  return active ? active.dataset.tab : 'dashboard';
}

// ============ COMPARISON BAR ============
// Every member's current-window absence on one scale, so a family can be read
// against each other at a glance. Scaled to max(180, worst) rather than a fixed
// 180: since the window became a true rolling 12 months, a member can be at 340
// legitimately, and a fixed scale would clip exactly the bar that matters most.
function renderComparison(results) {
  const scaleMax = Math.max(180, ...results.map(r => r.calc.daysAbsentInWindow));
  const capPct = (180 / scaleMax) * 100;
  const rows = results.map(r => {
    const c = r.calc;
    const pct = (c.daysAbsentInWindow / scaleMax) * 100;
    return `
      <div class="cmp-row">
        <div class="cmp-name" title="${esc(r.member.name)}">${esc(r.member.name)}</div>
        <div class="cmp-track">
          <div class="cmp-fill" style="width:${pct}%;background:var(--${c.status})"></div>
          <div class="cmp-cap" style="left:${capPct}%"></div>
        </div>
        <div class="cmp-val" style="color:var(--${c.status})">${c.daysAbsentInWindow}</div>
      </div>`;
  }).join('');
  return `<div class="cmp">${rows}</div><div class="cmp-legend"><i></i> ${t('chartCapLabel')}</div>`;
}

// ============ INIT ============
function showLoadFailure(err) {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>${t('loadFailTitle')}</h2>
      <div class="danger-box">${esc(err && err.message ? err.message : String(err))}</div>
      <p style="font-size:13px;color:var(--text2);margin-top:8px">${esc(isDesktop ? t('loadFailBody')(Store.describe()) : t('loadFailWeb'))}</p>
    </div>`;
}

async function boot() {
  let loaded;
  try {
    loaded = await Store.load();
  } catch (err) {
    // Deliberately do NOT fall back to empty data. A blank app invites the user
    // to start typing, and the first save would then overwrite the very file we
    // just failed to read. Stop, and point at the backups instead.
    applyStaticI18n();
    showLoadFailure(err);
    return;
  }
  data = loaded;
  storeReady = true;
  // Only now is it safe to let anyone touch the data. Left disabled on a load
  // failure on purpose: if we could not read the file we do not know what is in
  // it, so we must not offer actions that would write over it.
  document.querySelectorAll('.header-actions button').forEach(b => { b.disabled = false; });
  applyStaticI18n();
  render('dashboard');
}

boot();
</script>
</body>
</html>
