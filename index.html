<!DOCTYPE html>
<html lang="zh-hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNO 身份狀態追蹤器</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f7f8fa;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --text2: #5f6572;
    --accent: #1a56db;
    --accent2: #e8eefb;
    --green: #0d8c44;
    --green-bg: #d4f5e0;
    --amber: #b45309;
    --amber-bg: #fef3c7;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  .header { background: var(--accent); color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header .subtitle { font-size: 12px; opacity: .85; }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .lang-toggle { display: inline-flex; border: 1px solid rgba(255,255,255,.4); border-radius: 6px; overflow: hidden; }
  .lang-toggle button { background: transparent; color: #fff; border: none; padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 500; }
  .lang-toggle button.active { background: #fff; color: var(--accent); }
  .tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 16px; }
  .tab { padding: 10px 18px; font-size: 14px; cursor: pointer; border: none; background: none; color: var(--text2); border-bottom: 2px solid transparent; transition: all .15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--text); }
  .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-blue { background: var(--accent2); color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 8px 12px; border-bottom: 2px solid var(--border); color: var(--text2); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: var(--accent2); }
  .btn { display: inline-flex; align-items: center; gap: 4px; padding: 7px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text); transition: all .15s; }
  .btn:hover { background: var(--bg); }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #1548b8; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-danger { color: var(--red); }
  .btn-danger:hover { background: var(--red-bg); }
  .form-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 10px; }
  .form-group { display: flex; flex-direction: column; gap: 3px; }
  .form-group label { font-size: 12px; color: var(--text2); font-weight: 500; }
  input, select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; background: var(--card); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent2); }
  .stat { text-align: center; }
  .stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
  .progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width .3s; }
  .member-header { display: flex; justify-content: space-between; align-items: center; }
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--card); border-radius: 12px; padding: 24px; width: 90%; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .modal h2 { margin-bottom: 16px; }
  .modal .form-row { margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
  .empty-state p { margin: 8px 0; }
  .chart-container { position: relative; height: 250px; }
  .info-box { background: var(--accent2); border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 13px; color: var(--accent); margin-bottom: 16px; }
  .warning-box { background: var(--amber-bg); border-left: 3px solid var(--amber); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 13px; color: var(--amber); margin-bottom: 16px; }
  .danger-box { background: var(--red-bg); border-left: 3px solid var(--red); padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 13px; color: var(--red); margin-bottom: 16px; }

  @media print { .tabs, .header-actions, .btn, .tab { display: none !important; } .card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; } }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .container { padding: 10px; } }

const LANG_KEY = 'bno-tracker-lang';
let currentLang = (function () {
  const saved = localStorage.getItem(LANG_KEY);
  if (saved && I18N[saved]) return saved;
  // Default: detect English browsers; fall back to Chinese (original audience)
  return (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'zh';
})();

function t(key) { return I18N[currentLang][key]; }

function setLang(lang) {
  if (!I18N[lang]) return;
  currentLang = lang;
  localStorage.setItem(LANG_KEY, lang);
  applyStaticI18n();
  render(getCurrentTab());
}

  document.documentElement.lang = t('htmlLang');
  document.title = t('docTitle');

  document.getElementById('appSubtitle').textContent = t('appSubtitle');

  document.getElementById('btnImportJson').textContent = t('importJson');
  document.getElementById('btnExportCsv').textContent = t('exportCsv');
  document.getElementById('langZh').classList.toggle('active', currentLang === 'zh');
  document.getElementById('langEn').classList.toggle('active', currentLang === 'en');

  document.getElementById('tabs').innerHTML = `
    <button class="tab" data-tab="dashboard" onclick="showTab('dashboard')">${t('tabDashboard')}</button>
    <button class="tab" data-tab="members" onclick="showTab('members')">${t('tabMembers')}</button>

  const tab = getCurrentTab();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

const STORAGE_KEY = 'bno-tracker-data';

function getDefaultData() {
  return { familyName: 'Family', members: [], trips: [] };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : getDefaultData();
  } catch { return getDefaultData(); }
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let data = loadData();

// ============ DATE UTILITIES ============
// IMPORTANT: <input type="date"> values are YYYY-MM-DD strings. `new Date("YYYY-MM-DD")`
// parses them as UTC midnight — that flips to the previous day in any UTC-negative
// timezone, breaking display and arithmetic. parseDate + toDateStr keep everything
// in the user's LOCAL calendar.
function parseDate(d) {
  if (d instanceof Date) return new Date(d.getTime());
  if (typeof d === 'string') {
    const m = d.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  return new Date(d);
}

function toDateStr(d) {
  const dt = d instanceof Date ? d : parseDate(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function daysBetween(d1, d2) {
  const a = parseDate(d1); a.setHours(0,0,0,0);
  const b = parseDate(d2); b.setHours(0,0,0,0);
  return Math.round((b - a) / 86400000);
}

function addDays(d, n) {
  const r = parseDate(d); r.setDate(r.getDate() + n); return r;
}

function fmt(d) {
  if (!d) return '';
  const dt = parseDate(d);
  return dt.toLocaleDateString(t('locale'), { day: '2-digit', month: 'short', year: 'numeric' });
}

function todayStr() {
  return toDateStr(new Date());
}

// ============ BNO ILR CALCULATION ENGINE ============
function calcRollingWindow(member, trips) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const memberTrips = trips.filter(tr => tr.memberId === member.id)
    .sort((a,b) => parseDate(a.departureDate) - parseDate(b.departureDate));

  const windowStart = addDays(today, -179);

  let daysAbsentInWindow = 0;
  let absentPeriods = [];

  memberTrips.forEach(trip => {
    const tripEnd = parseDate(trip.returnDate || todayStr());
    tripEnd.setHours(0,0,0,0);
    const tripStart = parseDate(trip.departureDate);
    tripStart.setHours(0,0,0,0);

    const overlapStart = new Date(Math.max(tripStart.getTime(), windowStart.getTime()));
    const overlapEnd = new Date(Math.min(tripEnd.getTime(), today.getTime()));

    if (overlapStart <= overlapEnd) {
      const days = daysBetween(toDateStr(overlapStart), toDateStr(overlapEnd)) + 1;
      daysAbsentInWindow += days;
      absentPeriods.push({
        from: trip.departureDate,
        to: trip.returnDate || t('stillAway'),
        days: days,
        overlap: days
      });
    }
  });

  const remaining = Math.max(0, 180 - daysAbsentInWindow);
  const status = daysAbsentInWindow >= 180 ? 'red' : daysAbsentInWindow >= 120 ? 'amber' : 'green';

  const grantDate = parseDate(member.bnoGrantDate);
  grantDate.setHours(0,0,0,0);
  let totalAbsent = 0;
  const presentTrips = [];

  memberTrips.forEach(trip => {
    const tripEnd = trip.returnDate ? parseDate(trip.returnDate) : new Date(today.getTime());
    tripEnd.setHours(0,0,0,0);
    const tripStart = parseDate(trip.departureDate);
    tripStart.setHours(0,0,0,0);
    if (tripEnd >= grantDate) {
      const days = daysBetween(
        toDateStr(new Date(Math.max(tripStart.getTime(), grantDate.getTime()))),
        toDateStr(tripEnd)
      ) + 1;
      totalAbsent += days;
      presentTrips.push({
        from: trip.departureDate,
        to: trip.returnDate || t('stillAway'),
        days: days
      });
    }
  });

  const ilrEarliest = addDays(member.bnoGrantDate, 5 * 365);
  const ilrEarliestStr = toDateStr(ilrEarliest);

  let worstWindow = 0;
  for (let i = 0; i < 10; i++) {
    const periodStart = addDays(member.bnoGrantDate, i * 182);
    const periodEnd = addDays(periodStart, 179);
    if (periodStart > today) break;

    let windowAbsences = 0;
    memberTrips.forEach(trip => {
      const tripEnd = trip.returnDate ? parseDate(trip.returnDate) : new Date(today.getTime());
      const tripStart = parseDate(trip.departureDate);
      const ws = new Date(Math.max(tripStart.getTime(), periodStart.getTime()));
      const we = new Date(Math.min(tripEnd.getTime(), periodEnd.getTime()));
      if (ws <= we) {
        windowAbsences += daysBetween(toDateStr(ws), toDateStr(we)) + 1;
      }
    });
    worstWindow = Math.max(worstWindow, windowAbsences);
  }

  const isCompliant = worstWindow < 180;
  const isEligible = ilrEarliest <= today && isCompliant;
  const isGettingClose = ilrEarliest <= addDays(today, 90) && isCompliant;

  const daysToILR = Math.max(0, daysBetween(todayStr(), ilrEarliestStr));

  return {
    daysAbsentInWindow,
    remaining,
    status,
    totalAbsent,
    absentPeriods,
    presentTrips,
    isCompliant,
    isEligible,
    isGettingClose,
    daysToILR,
    ilrEarliest,
    ilrEarliestStr,
    worstWindow
  };
}

// ============ TAB NAVIGATION ============
function showTab(name) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  render(name);
}

// ============ RENDER ENGINE ============
function render(tab) {
  const app = document.getElementById('app');
  switch(tab) {
    case 'dashboard': app.innerHTML = renderDashboard(); break;
    case 'members': app.innerHTML = renderMembers(); break;
    case 'trips': app.innerHTML = renderTrips(); break;
    case 'planner': app.innerHTML = renderPlanner(); break;
  }
  if (tab === 'dashboard') setTimeout(drawDashboardChart, 100);
}

function renderDashboard() {
  const totalMembers = data.members.length;
  if (totalMembers === 0) {
    return `<div class="empty-state"><h2>${t('welcomeTitle')}</h2><p>${t('welcomeMsg')}</p><button class="btn btn-primary" onclick="showTab('members')">${t('addFirstMember')}</button></div>`;
  }

  const results = data.members.map(m => ({ member: m, calc: calcRollingWindow(m, data.trips) }));

  const compliant = results.filter(r => r.calc.status === 'green').length;
  const warnings = results.filter(r => r.calc.status === 'amber').length;
  const violations = results.filter(r => r.calc.status === 'red').length;

  let memberCards = results.map(r => {
    const { member: m, calc } = r;
    const pct = Math.min(100, Math.round((calc.daysAbsentInWindow / 180) * 100));
    const barColor = calc.status === 'green' ? 'var(--green)' : calc.status === 'amber' ? 'var(--amber)' : 'var(--red)';
    const statusLabel = calc.status === 'green' ? t('statusGreen') : calc.status === 'amber' ? t('statusAmber') : t('statusRed');

    let ilrInfo = '';
    if (calc.isEligible) {
      ilrInfo = `<span class="badge badge-green">${t('ilrEligible')}</span>`;
    } else if (calc.isGettingClose) {
      ilrInfo = `<span class="badge badge-amber">${t('ilrApprox')(calc.daysToILR)}</span>`;
    } else {
      ilrInfo = `<span class="badge badge-blue">${t('ilrIn')(calc.daysToILR)}</span>`;
    }

    return `
      <div class="card">
        <div class="member-header">
          <h3 style="margin:0">${esc(m.name)}</h3>
          <span class="badge badge-${calc.status}">${statusLabel}</span>
        </div>
        <div style="margin-top:12px">
          <div class="grid3">
            <div class="stat">
              <div class="stat-value" style="color:var(--${calc.status === 'green' ? 'green' : calc.status === 'amber' ? 'amber' : 'red'})">${calc.daysAbsentInWindow}</div>
              <div class="stat-label">${t('daysInWindow')}</div>
            </div>
            <div class="stat">
              <div class="stat-value">${calc.remaining}</div>
              <div class="stat-label">${t('daysRemaining')}</div>
            </div>
            <div class="stat">
              <div class="stat-value">${calc.totalAbsent}</div>
              <div class="stat-label">${t('totalDaysAbsent')}</div>
            </div>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${pct}%;background:${barColor}"></div>
          </div>
          <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
            <span style="font-size:12px;color:var(--text2)">${t('bnoGrantDate')}: ${fmt(m.bnoGrantDate)}</span>

          ${calc.worstWindow >= 150 ? `<div class="warning-box" style="margin-top:8px">${t('worstWindowMsg')(calc.worstWindow)}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="grid3">
      <div class="card stat">
        <div class="stat-value">${totalMembers}</div>
        <div class="stat-label">${t('statFamily')}</div>
      </div>
      <div class="card stat">
        <div class="stat-value" style="color:var(--green)">${compliant}</div>
        <div class="stat-label">${t('statWithin')}</div>
      </div>
      <div class="card stat">
        <div class="stat-value" style="color:${warnings > 0 ? 'var(--amber)' : 'var(--green)'}">${warnings}</div>
        <div class="stat-label">${t('statNear')}</div>

      <div class="card stat">
        <div class="stat-value" style="color:var(--red)">${violations}</div>

// ============ SAVE OPERATIONS ============
function saveTrip(editId) {
  const memberId = document.getElementById('mTripMember').value;
  const departure = document.getElementById('mTripDeparture').value;
  const returnDate = document.getElementById('mTripReturn').value;
  const purpose = document.getElementById('mTripPurpose').value;

  if (!memberId || !departure) { alert(t('alertTripFields')); return; }
  if (returnDate && returnDate < departure) { alert(t('alertReturnAfter')); return; }

  if (editId) {
    const idx = data.trips.findIndex(tr => tr.id === editId);
    if (idx >= 0) data.trips[idx] = { ...data.trips[idx], memberId, departureDate: departure, returnDate, purpose };
  } else {
    data.trips.push({ id: genId(), memberId, departureDate: departure, returnDate, purpose });
  }

  saveData(data);
  closeModal('tripModal');
  render(getCurrentTab());
}

function deleteTrip(id) {
  if (!confirm(t('confirmDelTrip'))) return;
  data.trips = data.trips.filter(tr => tr.id !== id);
  saveData(data);
  render(getCurrentTab());
}

function saveMember(editId) {
  const name = document.getElementById('mMemberName').value.trim();
  const grantDate = document.getElementById('mGrantDate').value;
  const relationship = document.getElementById('mRelationship').value;
  const notes = document.getElementById('mNotes').value.trim();

  } else {
    data.members.push({ id: genId(), name, bnoGrantDate: grantDate, relationship, notes });
  }

  saveData(data);
  closeModal('memberModal');
  render(getCurrentTab());
}

function editMember(id) { showMemberModal(id); }

function deleteMember(id) {

  data.members = data.members.filter(m => m.id !== id);

// ============ PLANNER LOGIC ============
function calcPlanner() {
  const memberId = document.getElementById('planMember').value;
  const departure = document.getElementById('planDeparture').value;
  const returnDate = document.getElementById('planReturn').value;
  if (!departure || !returnDate) { alert(t('alertTwoDates')); return; }

  const member = data.members.find(m => m.id === memberId);
  if (!member) return;

  const proposedTrips = [...data.trips, { memberId, departureDate: departure, returnDate }];
  const calc = calcRollingWindow(member, proposedTrips);
  const currentCalc = calcRollingWindow(member, data.trips);
  const tripDays = daysBetween(departure, returnDate) + 1;

  const headline = calc.status === 'green' ? t('canTravel') : calc.status === 'amber' ? t('watchOut') : t('cantTravel');

  let resultHtml = `
    <div class="card">
      <h2>${t('resultFor')(esc(member.name))}</h2>
      <div class="${calc.status === 'green' ? 'info-box' : calc.status === 'amber' ? 'warning-box' : 'danger-box'}">
        <strong>${headline}</strong><br>
        ${t('currentLine')(currentCalc.daysAbsentInWindow, calc.daysAbsentInWindow)}
      </div>
      <div class="grid3">
        <div class="stat">
          <div class="stat-value">${tripDays}</div>
          <div class="stat-label">${t('tripDurationLabel')}</div>
        </div>
        <div class="stat">
          <div class="stat-value" style="color:${calc.daysAbsentInWindow >= 180 ? 'var(--red)' : calc.daysAbsentInWindow >= 120 ? 'var(--amber)' : 'var(--green)'}">${calc.daysAbsentInWindow}</div>
          <div class="stat-label">${t('daysWindowAfter')}</div>
        </div>
        <div class="stat">
          <div class="stat-value">${calc.remaining}</div>
          <div class="stat-label">${t('daysRemaining')}</div>
        </div>
      </div>
      <div style="margin-top:12px">
        <div class="progress-bar">
          <div class="progress-fill" style="width:${Math.min(100, Math.round((calc.daysAbsentInWindow/180)*100))}%;background:${calc.status === 'green' ? 'var(--green)' : calc.status === 'amber' ? 'var(--amber)' : 'var(--red)'}"></div>
        </div>
      </div>
    </div>`;

  document.getElementById('planResult').innerHTML = resultHtml;
}

function calcScenarios() {
  const memberId = document.getElementById('scenarioMember').value;
  const departure = document.getElementById('scenarioDate').value;
  if (!memberId || !departure) { alert(t('alertMemberAndDate')); return; }

  const member = data.members.find(m => m.id === memberId);
  if (!member) return;

  const durations = [7, 14, 30, 60, 90, 120, 150, 180];

  let rows = durations.map(d => {
    const returnDate = toDateStr(addDays(departure, d - 1));
    const proposedTrips = [...data.trips, { memberId, departureDate: departure, returnDate }];
    const calc = calcRollingWindow(member, proposedTrips);
    const safe = calc.status === 'green' ? '✓' : calc.status === 'amber' ? '⚠' : '✗';
    return `<tr>
      <td>${t('durationCell')(d)}</td>
      <td>${fmt(returnDate)}</td>
      <td>${calc.daysAbsentInWindow}/180</td>
      <td>${t('daysLeftCell')(calc.remaining)}</td>
      <td>${safe}</td>
    </tr>`;
  }).join('');

  document.getElementById('scenarioResult').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>${t('colDurationDays')}</th><th>${t('colReturnDate')}</th><th>${t('colWindowFraction')}</th><th>${t('colDaysLeft')}</th><th>${t('colSafeIcon')}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ============ EXPORT/IMPORT ============
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `bno-tracker-${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(url);
}

function importData() {
  document.getElementById('importInput').click();
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.members) { data = imported; saveData(data); render(getCurrentTab()); }
      else alert(t('alertInvalidFile'));
    } catch { alert(t('alertCantParse')); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function exportCSV() {
  if (data.trips.length === 0) { alert(t('alertNoTrips')); return; }
  let csv = t('csvHeader') + '\n';
  data.trips.forEach(tr => {
    const name = getMemberName(tr.memberId);
    const dur = tr.returnDate ? daysBetween(tr.departureDate, tr.returnDate) : daysBetween(tr.departureDate, todayStr());
    csv += `"${name}","${tr.departureDate}","${tr.returnDate || ''}",${dur},"${tr.purpose || ''}"\n`;
  });
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `bno-trips-${todayStr()}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

// ============ HELPERS ============
function genId() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function esc(s) { if (s === undefined || s === null || s === '') return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function getMemberName(id) { const m = data.members.find(x => x.id === id); return m ? m.name : t('unknown'); }
function getCurrentTab() {
  const active = document.querySelector('.tab.active');
  return active ? active.dataset.tab : 'dashboard';
}

// ============ CHART ============
let dashboardChartInstance = null;
function drawDashboardChart() {
  const canvas = document.getElementById('dashboardChart');
  if (!canvas) return;
  if (dashboardChartInstance) { dashboardChartInstance.destroy(); dashboardChartInstance = null; }
  const ctx = canvas.getContext('2d');
  const results = data.members.map(m => ({ name: m.name, calc: calcRollingWindow(m, data.trips) }));

  dashboardChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: results.map(r => r.name),
      datasets: [
        {
          label: t('chartUsed'),
          data: results.map(r => r.calc.daysAbsentInWindow),
          backgroundColor: results.map(r => r.calc.status === 'green' ? '#0d8c44' : r.calc.status === 'amber' ? '#b45309' : '#dc2626'),
          borderRadius: 4,
        },
        {
          label: t('chartRemaining'),
          data: results.map(r => r.calc.remaining),
          backgroundColor: '#e2e5ea',
          borderRadius: 4,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { stacked: true, grid: { display: false } },
        y: { stacked: true, max: 180, beginAtZero: true, title: { display: true, text: t('chartDaysAxis') } }
      },
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          callbacks: {
            afterBody: (items) => {
              const r = results[items[0].dataIndex];
              const lbl = r.calc.status === 'green' ? t('statusNormal') : r.calc.status === 'amber' ? t('statusWarning') : t('statusOver');
              return `${t('chartStatusLabel')}: ${lbl}`;
            }
          }
        }
      }
    }
  });
}

// ============ INIT ============
applyStaticI18n();
render('dashboard');
</script>
