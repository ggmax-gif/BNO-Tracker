name: build

# Windows is built here because Tauri cannot cross-compile it from macOS and
# there is no Windows machine to hand. The macOS build stays local.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed only by the release job

jobs:
  checks:
    name: engine and static guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Static guards
        run: node test/static-checks.cjs
      - name: Engine suite
        run: node test/suite.cjs
      - name: Differential fuzz against the brute-force oracle
        run: node test/fuzz.cjs
      - name: Version guard (all four declarations must agree)
        working-directory: desktop
        run: npm run sync

  windows:
    name: windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'desktop/src-tauri -> target' }

      - name: Install CLI
        working-directory: desktop
        run: npm ci

      # --bundles overrides bundle.targets, which is set to the macOS pair for
      # local builds. NSIS rather than MSI: smaller, and a friendlier install
      # for a non-technical recipient.
      - name: Build
        working-directory: desktop
        run: npx tauri build --bundles nsis

      # The app booting is the one thing CI can actually prove. It exercises the
      # WebView, the inline script, boot(), and the filesystem bridge: if the
      # data directory appears, all four worked.
      - name: Smoke test — does it launch and reach the disk?
        shell: pwsh
        run: |
          $exe = "desktop/src-tauri/target/release/app.exe"
          if (-not (Test-Path $exe)) { throw "no binary at $exe" }
          $dir = "$env:APPDATA\uk.bnotracker.app"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $p = Start-Process $exe -PassThru
          for ($i = 0; $i -lt 30 -and -not (Test-Path $dir); $i++) { Start-Sleep -Seconds 1 }
          $ok = Test-Path $dir
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "app launched but never created $dir - boot() or the fs bridge failed" }
          Write-Host "boot reached the disk:"; Get-ChildItem $dir | ForEach-Object { Write-Host "  $_" }

      # Run the installer the way a recipient would, so the install guide can be
      # written from what actually happens rather than from what usually happens.
      - name: Install it, and report what a user would see
        shell: pwsh
        run: |
          $setup = (Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe)[0].FullName
          Write-Host "== signature =="
          $sig = Get-AuthenticodeSignature $setup
          Write-Host "  status : $($sig.Status)"
          Write-Host "  signer : $(if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '(none - unsigned)' })"
          Write-Host "  size   : $([math]::Round((Get-Item $setup).Length/1MB,1)) MB"

          Write-Host "== silent install (/S) =="
          $proc = Start-Process $setup -ArgumentList '/S' -PassThru -Wait
          Write-Host "  exit code: $($proc.ExitCode)"

          Write-Host "== where did it land =="
          foreach ($base in @($env:LOCALAPPDATA, $env:ProgramFiles, ${env:ProgramFiles(x86)})) {
            $c = Join-Path $base 'BNO Tracker'
            if (Test-Path $c) { Write-Host "  install dir: $c"; Get-ChildItem $c | ForEach-Object { Write-Host "    $($_.Name)" } }
          }
          Write-Host "== Start Menu (unfiltered) =="
          foreach ($sm in @("$env:APPDATA\Microsoft\Windows\Start Menu\Programs",
                            "$env:ProgramData\Microsoft\Windows\Start Menu\Programs")) {
            Write-Host "  [$sm]"
            Get-ChildItem $sm -Recurse -Include *.lnk -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "    $($_.Name)" }
          }
          Write-Host "== Desktop =="
          Get-ChildItem "$env:USERPROFILE\Desktop" -Filter *.lnk -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "== does the INSTALLED copy run? =="
          $installed = "$env:LOCALAPPDATA\BNO Tracker\app.exe"
          $dir = "$env:APPDATA\uk.bnotracker.app"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $p2 = Start-Process $installed -PassThru
          for ($i = 0; $i -lt 30 -and -not (Test-Path $dir); $i++) { Start-Sleep -Seconds 1 }
          $ok2 = Test-Path $dir
          Stop-Process -Id $p2.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok2) { throw "the installed copy did not reach the disk" }
          Write-Host "  installed copy booted and created its data directory"
          Write-Host "== uninstall =="
          Start-Process "$env:LOCALAPPDATA\BNO Tracker\uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 4
          Write-Host "  app dir removed : $(-not (Test-Path "$env:LOCALAPPDATA\BNO Tracker"))"
          Write-Host "  records kept    : $(Test-Path $dir)"
          Write-Host "== uninstall entry =="
          foreach ($k in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
                           'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*')) {
            Get-ItemProperty $k -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -like '*BNO*' } |
              ForEach-Object { Write-Host "  $($_.DisplayName)  v$($_.DisplayVersion)"; Write-Host "  uninstall: $($_.UninstallString)" }
          }

      - name: Name the installer after the version
        shell: pwsh
        id: ver
        run: |
          $v = (Get-Content desktop/package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "version $v"

      - uses: actions/upload-artifact@v4
        with:
          name: bno-tracker-windows-${{ steps.ver.outputs.version }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    name: macos installer
    runs-on: macos-latest          # Apple Silicon runner, so this builds aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'desktop/src-tauri -> target' }

      - name: Install CLI
        working-directory: desktop
        run: npm ci

      # bundle.targets is already app + dmg, and signingIdentity "-" makes Tauri
      # seal the bundle with an ad-hoc signature rather than leaving only the
      # linker's, which is what made 0.2.0 read as "damaged".
      - name: Build
        working-directory: desktop
        run: npx tauri build

      # 0.2.0 shipped with Sealed Resources=none and Info.plist unbound. Strict
      # verification is the check that would have caught it; it fails the build
      # rather than letting a "damaged" DMG reach a release.
      - name: Signature must be sealed, not just present
        run: |
          APP="desktop/src-tauri/target/release/bundle/macos/BNO Tracker.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -E "Sealed Resources|Info.plist|flags"
          if codesign -dvvv "$APP" 2>&1 | grep -q "Sealed Resources=none"; then
            echo "bundle is not sealed - Gatekeeper will call it damaged"; exit 1
          fi
          # Informational: runners may have Gatekeeper assessments disabled, so
          # this is printed rather than enforced. The codesign check above is
          # the one that distinguishes malformed from merely unsigned.
          spctl --status || true
          Q="$RUNNER_TEMP/quarantined.app"
          ditto "$APP" "$Q"
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$Q"
          spctl --assess --type execute "$Q" 2>&1 || true

      - name: Smoke test — does it launch and reach the disk?
        run: |
          BIN="desktop/src-tauri/target/release/bundle/macos/BNO Tracker.app/Contents/MacOS/app"
          DIR="$HOME/Library/Application Support/uk.bnotracker.app"
          rm -rf "$DIR"
          "$BIN" &
          PID=$!
          for i in $(seq 30); do [ -d "$DIR" ] && break; sleep 1; done
          kill "$PID" 2>/dev/null || true
          [ -d "$DIR" ] || { echo "app launched but never created $DIR - boot() or the fs bridge failed"; exit 1; }
          echo "boot reached the disk:"; ls -la "$DIR"

      - name: Name the installer after the version
        id: ver
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: bno-tracker-macos-${{ steps.ver.outputs.version }}
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: attach installers to the release
    needs: [checks, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Filenames contain a space, so the list has to survive word splitting.
          # read -d '' rather than mapfile: works on any bash, so this step can be
          # tested off the runner.
          FILES=()
          while IFS= read -r -d '' f; do FILES+=("$f"); done \
            < <(find dist \( -name '*.exe' -o -name '*.dmg' \) -print0)
          printf 'attaching: %s\n' "${FILES[@]}"
          # A release with one installer looks complete and is not. Require
          # exactly one per platform, or publish nothing.
          N_EXE=$(printf '%s\n' "${FILES[@]}" | grep -c '\.exe$' || true)
          N_DMG=$(printf '%s\n' "${FILES[@]}" | grep -c '\.dmg$' || true)
          if [ "$N_EXE" -ne 1 ] || [ "$N_DMG" -ne 1 ]; then
            echo "expected one .exe and one .dmg, found $N_EXE and $N_DMG - not publishing"; exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${FILES[@]}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Windows x64 and macOS Apple Silicon installers, both built in CI. Neither is code-signed, so SmartScreen and Gatekeeper warn on first run - see docs/INSTALL.md." \
            || gh release upload "${GITHUB_REF_NAME}" "${FILES[@]}" --clobber
          # Confirm what actually landed rather than trusting the exit code.
          gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'
          N=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '[.assets[] | select(.name | test("\\.(exe|dmg)$"))] | length')
          [ "$N" -ge 2 ] || { echo "release has $N installers after upload"; exit 1; }
